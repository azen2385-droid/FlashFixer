name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore FlashFixer.csproj

      - name: Build Solution
        run: msbuild FlashFixer.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashFixer-EXE
          # السطر ده هو السر: بيدور على أي فولدر اسمه Release وياخد اللي جواه
          path: "**/bin/Release/**"
