name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # لا حاجة لخطوة Setup .NET، لأن msbuild مثبت مسبقاً على windows-latest
      # الخطوة التالية اختيارية للتأكد من وجود الأدوات
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore FlashFixer.csproj

      - name: Build Solution
        run: msbuild FlashFixer.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashFixer-EXE
          # المسار يعتمد على هيكل مشروعك. عادةً ما يكون مشابهاً لهذا:
          path: bin\Release\net48\FlashFixer.exe
