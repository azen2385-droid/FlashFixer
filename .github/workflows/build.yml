name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. بناء المشروع باستخدام dotnet build المخصص لمشاريع SDK-style
      - name: Build Solution
        run: dotnet build FlashFixer.csproj -c Release

      # 2. خطوة تشخيصية: عرض كل الملفات اللي تم بناؤها
      - name: List Build Output
        run: |
          Write-Host "--- محتويات مجلد bin ---"
          dir bin -Recurse -ErrorAction SilentlyContinue
          Write-Host "--- محتويات مجلد obj ---"
          dir obj -Recurse -ErrorAction SilentlyContinue

      # 3. رفع الملفات من المسار الافتراضي لمشاريع net48
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashFixer-EXE
          path: bin/Release/net48/
          if-no-files-found: error
